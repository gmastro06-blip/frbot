name: ci

on:
  push:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-mock
          python -m pip install numpy pillow opencv-python-headless mss

      - name: Guardrails (fast fail)
        env:
          FRBOT_MODE: mock
        run: |
          python -m pytest -q tests/test_ci_guardrails.py tests/test_one_intent_one_input.py

      - name: Pytest
        env:
          FRBOT_MODE: mock
        run: |
          python -m pytest -q

      - name: Smoke (PowerShell)
        shell: pwsh
        run: |
          ./smoke.ps1

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-mock
          python -m pip install numpy pillow opencv-python-headless mss

      - name: Guardrails (fast fail)
        env:
          FRBOT_MODE: mock
        run: |
          python -m pytest -q tests/test_ci_guardrails.py tests/test_one_intent_one_input.py

      - name: Pytest
        env:
          FRBOT_MODE: mock
        run: |
          python -m pytest -q

  audit-mock:
    runs-on: ubuntu-latest
    needs: [test-windows, test-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-mock
          python -m pip install numpy pillow opencv-python-headless mss

      - name: Run auditor (mock)
        env:
          FRBOT_MODE: mock
        run: |
          python tools/audit_all.py

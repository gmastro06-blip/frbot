[tool.pytest.ini_options]
testpaths = [
	"tests",
]
markers = [
	"real_frames: tests that require local real-client PPM evidence (not committed)",
]

[tool.poetry]
name = "fenril"
version = "0.1.0"
description = "Minimal contract-driven runtime (rewrite)"
authors = ["Paulo Lacerda <paulorl2810@gmail.com>", "lucasmonstro <joao.galiano.silva@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.11.7"

# Real-mode capture backends (explicit dependencies)
mss = "^9.0.1"
dxcam = "^0.0.5"
numpy = "^1.26.4"
opencv-python = "^4.10.0.84"

# Deterministic ROI calibration/overlay (PPM via Pillow)
pillow = "^10.4.0"

# OBS WebSocket v5 client (GetSourceScreenshot)
websocket-client = "^1.7.0"


[tool.poetry.group.test.dependencies]
pytest = "^7.1.3"
pytest-cov = "^4.0.0"
pytest-mock = "^3.8.2"

[tool.poetry.group.dev.dependencies]
pyinstaller = "^5.12.0"
taskipy = "^1.10.3"

[tool.taskipy.tasks]
test = "python -m pytest ."

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"